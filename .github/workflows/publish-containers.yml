name: Publish Container Packages (GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (defaults to "latest" and git sha)'
        required: false
        default: 'latest'
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - server
          - agent-computer
          - supervisor
          - agent-bot
          - agent-langgraph
          - agent-claude-sdk
          - agent-pydantic-ai
          - agent-llamaindex
          - agent-mastra
          - agent-crewai
          - agent-microsoft
          - agent-strands
          - agent-ag2
          - agent-agno
          - agent-adk
          - agent-langroid
          - agent-langgraph-agui

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
          GIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/synaptodesk-${COMPONENT}"
          # Convert to lowercase for Docker registry compliance
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${GIT_SHA}"
          if [ "$REF_TYPE" = "tag" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:${REF_NAME}"
          fi
          if [ -n "$INPUT_TAG" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:${INPUT_TAG}"
          fi
          
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
