name: Publish Container Packages (GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (defaults to "latest" and git sha)'
        required: false
        default: 'latest'
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - server
          - agent-computer
          - supervisor
          - agent-bot
          - agent-langgraph
          - agent-claude-sdk
          - agent-pydantic-ai
          - agent-llamaindex
          - agent-mastra
          - agent-crewai
          - agent-microsoft
          - agent-strands
          - agent-ag2
          - agent-agno
          - agent-adk
          - agent-langroid
          - agent-langgraph-agui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/synaptodesk-${{ matrix.component }}"
          # Convert to lowercase for Docker registry compliance
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:${{ github.ref_name }}"
          fi
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:${{ github.event.inputs.tag }}"
          fi
          
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
