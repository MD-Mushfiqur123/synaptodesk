<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <title>SynaptoDesk Logo</title>
  <!-- 32x32 True Pixel Art Canvas -->
  <!-- Background -->
  <rect width="32" height="32" fill="#000000" />
  
  <!-- Outer Circular / Squircle Pixel Frame -->
  <!-- Top & Bottom horizontal pixel bars -->
  <rect x="10" y="4" width="12" height="2" fill="#ffffff" />
  <rect x="10" y="26" width="12" height="2" fill="#ffffff" />
  <rect x="6" y="6" width="4" height="2" fill="#ffffff" />
  <rect x="22" y="6" width="4" height="2" fill="#ffffff" />
  <rect x="6" y="24" width="4" height="2" fill="#ffffff" />
  <rect x="22" y="24" width="4" height="2" fill="#ffffff" />
  
  <!-- Left & Right vertical pixel bars -->
  <rect x="4" y="8" width="2" height="16" fill="#ffffff" />
  <rect x="26" y="8" width="2" height="16" fill="#ffffff" />
  
  <!-- Inner Face Pixels -->
  <!-- Left Eye: 2x6 pixel bar -->
  <rect x="9" y="11" width="3" height="7" fill="#ffffff" />
  
  <!-- Right Eye: 2x6 pixel bar with a 1-pixel synaptic hollow center -->
  <rect x="20" y="11" width="3" height="7" fill="#ffffff" />
  <rect x="21" y="13" width="1" height="2" fill="#000000" />
  
  <!-- Center Synapse Pixel Node -->
  <rect x="15" y="14" width="2" height="2" fill="#ffffff" />
  
  <!-- Mouth: 12x2 pixel bar -->
  <rect x="10" y="21" width="12" height="2" fill="#ffffff" />
</svg>
