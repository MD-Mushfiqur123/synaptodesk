<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SynaptoDesk Master Vector Logo</title>
  <!-- Background -->
  <rect width="512" height="512" fill="#000000" rx="96" />
  
  <!-- Outer Neural Squircle Border -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="none" stroke="#ffffff" stroke-width="24" />
  
  <!-- Left Eye: Geometric Capsule Pixel -->
  <rect x="144" y="176" width="48" height="112" rx="16" fill="#ffffff" />
  
  <!-- Right Eye: Neural Capsule with Synaptic Core -->
  <rect x="320" y="176" width="48" height="112" rx="16" fill="#ffffff" />
  <rect x="336" y="208" width="16" height="32" rx="4" fill="#000000" />
  
  <!-- Center Synapse Node -->
  <rect x="240" y="224" width="32" height="32" rx="8" fill="#ffffff" />
  
  <!-- Mouth: Geometric Pixel Slot -->
  <rect x="144" y="352" width="224" height="36" rx="12" fill="#ffffff" />
</svg>
