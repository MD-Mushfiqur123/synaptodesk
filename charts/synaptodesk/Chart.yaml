apiVersion: v2
name: synaptodesk
description: Run SynaptoDesk on any Kubernetes cluster, managed or your own
type: application
# The chart's own version, bumped when templates or defaults change.
version: 0.1.3
# The SynaptoDesk release this chart's default image tag points at. Kept equal to package.json's version
# (the last version published) by the release workflow, and CI refuses a tree where they have drifted.
appVersion: "0.0.15"
home: https://github.com/MD-Mushfiqur123/SynaptoDesk
sources:
  - https://github.com/MD-Mushfiqur123/SynaptoDesk
keywords:
  - synaptodesk
  - copilotkit
  - agents
maintainers:
  - name: MD-Mushfiqur123
    url: https://github.com/MD-Mushfiqur123
dependencies:
  # BUNDLED FOR SOMEBODY TRYING IT, OFF FOR ANYBODY WITH A DATABASE. A deployment with RDS, Cloud SQL
  # or Azure Database sets `postgresql.enabled: false` and a connection URL, which is the same line
  # the Intelligence chart draws, so somebody who has deployed that does not have to relearn it.
  - name: postgresql
    # EXACT, NOT A RANGE. `~16` let a subchart patch arrive on its own, and a subchart patch carries a
    # new PostgreSQL image tag. That image comes from Bitnami's frozen `bitnamilegacy` mirror, which
    # is not gaining new tags, so the next patch is one an install cannot pull. CI renders this chart
    # and never pulls from it, so nothing here would have said a word: the first sign would have been
    # somebody's install sitting in ImagePullBackOff. Bump it deliberately, with the tag below.
    version: "16.7.27"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
